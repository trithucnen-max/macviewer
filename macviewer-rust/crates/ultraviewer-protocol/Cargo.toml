[package]
name = "ultraviewer-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Engineering"]
description = "UltraViewer remote desktop protocol engine in Rust"

[dependencies]
aes = "0.8"
cbc = "0.1"
des = "0.8"
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
md-5 = "0.10"
sha1 = "0.10"
rand = "0.8"
bytes = "1.9"
tokio = { version = "1.41", features = ["full"] }
thiserror = "2.0"
log = "0.4"

[build-dependencies]
cc = "1.2"
