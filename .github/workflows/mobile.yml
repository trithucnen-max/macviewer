name: Mobile Build (Android APK & iOS)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version, e.g. v2.2.2"
        required: true
        default: "v2.2.2"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (ARM64 & x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Rust toolchain & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Build Rust FFI for Android
        working-directory: macviewer-rust
        run: |
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../android/app/src/main/jniLibs/x86_64
          export ANDROID_NDK_HOME=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1) || true
          if [ -n "$ANDROID_NDK_HOME" ]; then
            cargo install cargo-ndk || true
            cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release || true
          fi

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease || gradle assembleDebug

      - name: Collect Android Artifact
        run: |
          mkdir -p mobile-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} mobile-artifacts/Utralview-v${{ env.VERSION }}-android.apk \;
          cd mobile-artifacts && sha256sum *.apk > SHA256SUMS-ANDROID.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile-artifacts/*
          retention-days: 7

      - name: Attach APK to GitHub Release
        run: |
          gh release upload "${{ env.TAG }}" mobile-artifacts/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS Package (iPhone & iPad)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build iOS Target with SwiftPM
        run: |
          swift build --target UtralviewMobile -c release --triple arm64-apple-ios17.0 -Xswiftc -sdk -Xswiftc $(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p ios-artifacts
          zip -j "ios-artifacts/Utralview-v${{ env.VERSION }}-ios-client.zip" Sources/UtralviewMobile/*.swift Package.swift
          echo "Utralview iOS v${{ env.VERSION }} for iPhone & iPad" > ios-artifacts/README-iOS.txt
          cd ios-artifacts && sha256sum * > SHA256SUMS-IOS.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-assets
          path: ios-artifacts/*
          retention-days: 7

      - name: Attach iOS to GitHub Release
        run: |
          gh release upload "${{ env.TAG }}" ios-artifacts/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
