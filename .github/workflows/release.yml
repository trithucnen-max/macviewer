name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.3.3"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS Universal (Apple Silicon M1-M4 & Intel)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package macOS Universal DMG
        env:
          MACVIEWER_VERSION: ${{ env.VERSION }}
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/package_all_variants.sh
          ./scripts/package_all_variants.sh

      - name: Prepare macOS Release Assets
        run: |
          mkdir -p artifacts-macos
          cp dist/Utralview-for-Mac-v${{ env.VERSION }}-Universal.dmg dist/SHA256SUMS.txt artifacts-macos/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: artifacts-macos/*
          retention-days: 7

  publish:
    name: Publish macOS Universal Release to GitHub
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: all-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Utralview for Mac ${{ github.ref_name }} — BasanCorp Enterprise Edition
          prerelease: false
          generate_release_notes: true
          files: all-assets/*
