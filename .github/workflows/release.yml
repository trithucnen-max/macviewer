name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package macOS (Universal, Apple Silicon M1+, Intel)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Resolve version
        run: |
          version="${TAG#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *)   echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac

      - name: Package all macOS variants (Universal, arm64, x86_64)
        env:
          MACVIEWER_VERSION: ${{ env.VERSION }}
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/package_all_variants.sh
          ./scripts/package_all_variants.sh

      - name: Build macOS Artifacts
        run: |
          mkdir -p artifacts-macos
          cp dist/*.dmg artifacts-macos/
          cd artifacts-macos && shasum -a 256 *.dmg > SHA256SUMS-MACOS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          path: artifacts-macos/*
          retention-days: 7

  build-windows:
    name: Build Windows x86_64 & ARM64 (Surface)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Build Windows x86_64
        working-directory: macviewer-rust
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin ultraviewer-cli
          mkdir ..\artifacts-windows-x86_64
          copy target\x86_64-pc-windows-msvc\release\ultraviewer-cli.exe ..\artifacts-windows-x86_64\macviewer-cli-windows-x86_64.exe

      - name: Build Windows ARM64 (Surface Pro / Copilot+ PC)
        working-directory: macviewer-rust
        run: |
          cargo build --release --target aarch64-pc-windows-msvc --bin ultraviewer-cli
          mkdir ..\artifacts-windows-arm64
          copy target\aarch64-pc-windows-msvc\release\ultraviewer-cli.exe ..\artifacts-windows-arm64\macviewer-cli-windows-arm64-surface.exe

      - name: Package Windows Zips
        shell: bash
        run: |
          mkdir -p dist-windows
          cd artifacts-windows-x86_64 && 7z a ../dist-windows/MacViewer-v2.0.0-windows-x86_64.zip * && cd ..
          cd artifacts-windows-arm64 && 7z a ../dist-windows/MacViewer-v2.0.0-windows-arm64-surface.zip * && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist-windows/*
          retention-days: 7

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux x86_64
        working-directory: macviewer-rust
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --bin ultraviewer-cli

      - name: Package Linux tarball
        run: |
          mkdir -p dist-linux/macviewer-v2.0.0-linux-x86_64
          cp macviewer-rust/target/x86_64-unknown-linux-gnu/release/ultraviewer-cli dist-linux/macviewer-v2.0.0-linux-x86_64/macviewer-cli
          chmod +x dist-linux/macviewer-v2.0.0-linux-x86_64/macviewer-cli
          tar -czvf dist-linux/MacViewer-v2.0.0-linux-x86_64.tar.gz -C dist-linux macviewer-v2.0.0-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: dist-linux/MacViewer-v2.0.0-linux-x86_64.tar.gz
          retention-days: 7

  publish:
    name: Publish Full Release to GitHub
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd all-assets
          ls -la
          sha256sum * > SHA256SUMS.txt || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MacViewer v2.0.0 — BasanCorp Enterprise Edition
          prerelease: false
          generate_release_notes: true
          files: all-assets/*
