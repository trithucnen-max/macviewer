name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test & build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: Run tests
        run: swift test --parallel

      - name: Package Universal app
        env:
          MACVIEWER_SIGNING_IDENTITY: "-"
          MACVIEWER_BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package_app.sh release

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Utralview for Mac.app" dist/Utralview-for-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Utralview-for-Mac-${{ github.sha }}
          path: dist/Utralview-for-Mac.zip
          retention-days: 14
